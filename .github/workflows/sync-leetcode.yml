name: 🤖 Auto-Sync LeetCode Submissions

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "LeetCode username (optional, uses env var if not provided)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔄 Sync LeetCode submissions
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          GIT_AUTHOR_NAME: "LeetCode-Bot"
          GIT_AUTHOR_EMAIL: "bot@leetcode-sync.dev"
        run: node scripts/sync-fixed.js

      - name: 📤 Push changes to repository
        run: |
          git config user.name "LeetCode-Bot"
          git config user.email "bot@leetcode-sync.dev"
          git push origin main || echo "No changes to push"

      - name: 📊 Job status
        if: always()
        run: echo "✅ Sync workflow completed"
